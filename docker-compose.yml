version: '3.8'

services:
  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  backend:
    build: ./backend
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      MONGO_ENABLED: 'true'
      MONGO_URI: mongodb://mongo:27017/fleetdash
      REDIS_ENABLED: 'true'
      REDIS_URL: redis://redis:6379
      SIMULATION_ENABLED: 'true'
      SIM_VEHICLE_COUNT: 750
      SIM_TICK_MS: 250
    depends_on:
      - mongo
      - redis

  frontend:
    build: ./frontend
    ports:
      - '5173:5173'
    environment:
      VITE_SOCKET_URL: http://localhost:4000
    depends_on:
      - backend

volumes:
  mongo_data:
